; PHP-FPM Pool Configuration for Sampath Book Finder on AWS Lightsail
; Optimized for: 2 vCPUs, 4GB Total RAM
; Target file: /etc/php/8.3/fpm/pool.d/www.conf (or 8.2)

[www]
user = www-data
group = www-data

listen = /run/php/php8.3-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
listen.backlog = 4096

; Process Management Strategy
; Memory Budget: 35 workers * ~45MB = ~1,575MB RAM maximum.
; Leaving 1.4GB for MySQL, 256MB for Redis, and 850MB for OS/Nginx.
pm = dynamic
pm.max_children = 35
pm.start_servers = 10
pm.min_spare_servers = 6
pm.max_spare_servers = 15
pm.process_idle_timeout = 10s
pm.max_requests = 1000

; Concurrency & Timeout Safeguards
request_terminate_timeout = 60s
request_slowlog_timeout = 5s
slowlog = /var/log/php-fpm/slow.log

; Output & Diagnostics
catch_workers_output = yes
decorate_workers_output = no

; PHP Settings per Pool
php_admin_value[memory_limit] = 128M
php_admin_value[post_max_size] = 20M
php_admin_value[upload_max_filesize] = 16M
php_admin_value[max_execution_time] = 60
php_admin_value[max_input_time] = 60
php_admin_value[date.timezone] = Asia/Colombo
