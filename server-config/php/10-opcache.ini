; Zend OPcache Configuration for AWS Lightsail (2 vCPUs, 4GB RAM)
; Target file: /etc/php/8.3/mods-available/opcache.ini

zend_extension=opcache.so
opcache.enable=1
opcache.enable_cli=1

; Pre-allocate 192MB shared memory for opcode storage
opcache.memory_consumption=192
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000

; In production, check timestamps every 60s (or 0 for zero filesystem overhead if deploying with restart)
opcache.validate_timestamps=1
opcache.revalidate_freq=60

; Preserve docblocks and annotations required by modern frameworks
opcache.save_comments=1
opcache.load_comments=1
opcache.fast_shutdown=1

; JIT (Just-In-Time) Compiler for PHP 8+
opcache.jit=tracing
opcache.jit_buffer_size=64M
