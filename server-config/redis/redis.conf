# Redis In-Memory Cache Configuration for AWS Lightsail (2 vCPUs, 4GB RAM)
# Target file: /etc/redis/redis.conf (or /etc/redis/local.conf)

# Bind strictly to localhost
bind 127.0.0.1 ::1
protected-mode yes
port 6379

# Concurrency & Connections
tcp-backlog 2048
timeout 0
tcp-keepalive 300

# Memory Budget & Eviction Policy
# 256MB memory cap with LRU eviction ensures Redis never exhausts system RAM
maxmemory 256mb
maxmemory-policy allkeys-lru

# Disable background disk snapshots if used purely for caching/sessions
# (Eliminates disk I/O and RAM double-allocation during BGSAVE)
save ""
appendonly no

# Logging & Performance
loglevel notice
logfile /var/log/redis/redis-server.log
