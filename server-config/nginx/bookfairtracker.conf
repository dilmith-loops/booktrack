# Nginx Configuration for Sampath Book Finder on AWS Lightsail (2 vCPUs, 4GB RAM)
# Path: /etc/nginx/sites-available/bookfairtracker

# PHP-FPM FastCGI Upstream with Keepalive
upstream php-fpm-backend {
    server unix:/run/php/php8.3-fpm.sock;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name bookfairtracker.com www.bookfairtracker.com;

    # For SSL certification via Let's Encrypt / Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    # Redirect all HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bookfairtracker.com www.bookfairtracker.com;

    # SSL Certificates (managed by Certbot)
    # ssl_certificate /etc/letsencrypt/live/bookfairtracker.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/bookfairtracker.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Root pointing to the compiled Vite frontend distribution
    root /var/www/html/dist;
    index index.html index.php;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip Compression Tuning
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Upload size limit (allow photos in book spots)
    client_max_body_size 16M;
    client_body_buffer_size 128k;

    # Static Assets Long-term Cache (1 Year Immutable)
    location ~* \.(?:css|js|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Laravel Backend API Routing (/api/*)
    location /api/ {
        root /var/www/html/backend/public;
        try_files $uri $uri/ /index.php?$query_string;

        location ~ \.php$ {
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            fastcgi_pass php-fpm-backend;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /var/www/html/backend/public/index.php;
            fastcgi_param PATH_INFO $fastcgi_path_info;

            # FastCGI Connection & Buffer Tuning
            fastcgi_buffer_size 32k;
            fastcgi_buffers 16 16k;
            fastcgi_busy_buffers_size 64k;
            fastcgi_temp_file_write_size 64k;
            fastcgi_read_timeout 60s;
            fastcgi_send_timeout 60s;
            fastcgi_connect_timeout 5s;
        }
    }

    # Laravel Storage / Uploads (/storage/*)
    location /storage/ {
        alias /var/www/html/backend/storage/app/public/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
        try_files $uri =404;
    }

    # Vite Frontend SPA Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Deny access to hidden files (.env, .git, etc.)
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }
}
