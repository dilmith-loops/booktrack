# Linux Kernel & Network Tuning for AWS Lightsail (2 vCPUs, 4GB RAM)
# Target file: /etc/sysctl.d/99-lightsail-tuning.conf
# Apply with: sudo sysctl --system

# Socket Backlog and Concurrency Tuning
net.core.somaxconn = 4096
net.core.netdev_max_backlog = 4096
net.ipv4.tcp_max_syn_backlog = 4096

# Fast TCP Connection Reuse (Crucial for high concurrency reverse proxying)
net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_fin_timeout = 15
net.ipv4.ip_local_port_range = 1024 65535

# TCP Buffer Limits
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.ipv4.tcp_rmem = 4096 87380 16777216
net.ipv4.tcp_wmem = 4096 65536 16777216

# File Descriptors & Inotify
fs.file-max = 2097152
fs.inotify.max_user_watches = 524288

# Memory Management for 4GB RAM
# Discourage aggressive swapping to preserve SSD lifespan and prevent latency spikes
vm.swappiness = 10
vm.vfs_cache_pressure = 50
vm.dirty_background_ratio = 5
vm.dirty_ratio = 10
